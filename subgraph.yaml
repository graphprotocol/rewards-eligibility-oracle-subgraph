specVersion: 1.3.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: DataEdge
    network: arbitrum-one
    source:
      address: "0xfECf1535294095d032e072552D03f10fF2bEEa76"
      abi: EventfulDataEdge
      startBlock: 509758967
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Payload
        - Run
        - Criteria
        - Day
        - IndexerDay
        - Indexer
        - OracleState
      abis:
        - name: EventfulDataEdge
          file: ./abis/EventfulDataEdge.json
      eventHandlers:
        - event: Log(bytes)
          handler: handleLog
      file: ./src/mapping.ts
