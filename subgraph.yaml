specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Example
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Example
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ExampleEntity
      abis:
        - name: Example
          file: ./abis/Example.json
      eventHandlers:
        - event: ExampleEvent(indexed address,uint256)
          handler: handleExampleEvent
      file: ./src/mapping.ts
